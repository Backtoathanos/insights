name: CI / CD — Deploy to Insights

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI — validate & install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, curl, zip, gd, bcmath, intl, pdo_mysql, mailparse
          coverage: none

      - name: Validate composer.json
        # --strict fails on legacy exact-version pins (league/csv, etc.); schema is valid without it.
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Laravel sanity check
        run: php artisan --version

  deploy:
    name: CD — deploy via SSH
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail

            # Auto-locate the repo by finding artisan under $HOME (Hostinger layout).
            # Falls back to DEPLOY_PATH secret if set.
            if [[ -n "${{ secrets.DEPLOY_PATH }}" ]]; then
              APP_DIR="${{ secrets.DEPLOY_PATH }}"
            else
              APP_DIR="$(find "$HOME" -maxdepth 5 -name artisan 2>/dev/null | head -1 | xargs dirname 2>/dev/null || true)"
            fi

            if [[ -z "$APP_DIR" || ! -f "$APP_DIR/artisan" ]]; then
              echo "ERROR: Could not find Laravel root. Set the DEPLOY_PATH secret to the full path of public_html."
              exit 1
            fi

            echo "Deploying: $APP_DIR"
            cd "$APP_DIR"
            bash scripts/deploy.sh
